services:
  - type: web
    name: loveconnect
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_DIR
        value: /var/data
    disk:
      name: loveconnect-data
      mountPath: /var/data
      sizeGB: 1
